<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Organizar lista</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#16221F}
a{color:#246B55}a:hover{color:#1C5946}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8A9692; display: flex; flex-direction: column; justify-content: flex-end; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #16221F;">
  <div role="dialog" aria-label="Organizar lista" style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 16px;">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 999px; background: #D6E1DB; align-self: center;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700;">Organizar lista</h2>
      <a href="#" aria-label="Fechar" style="width: 48px; height: 48px; margin-right: -12px; display: flex; align-items: center; justify-content: center; color: #52655E;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    </div>
    <div role="radiogroup" aria-label="Ordem dos itens" style="display: flex; flex-direction: column; gap: 8px;">
      <label style="min-height: 64px; padding: 12px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; border-radius: 16px; border: 2px solid #246B55; background: #FFFFFF;">
        <span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; flex-shrink: 0; border-radius: 999px; border: 2px solid #246B55; display: flex; align-items: center; justify-content: center;"><span style="width: 12px; height: 12px; border-radius: 999px; background: #246B55;"></span></span>
        <input type="radio" name="ordem" checked="" style="position: absolute; width: 1px; height: 1px; opacity: 0;">
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; line-height: 24px; font-weight: 600;">Por categoria</span>
          <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">Agrupa como os corredores do mercado.</span>
        </span>
      </label>
      <label style="min-height: 64px; padding: 12px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; border-radius: 16px; border: 1px solid #D6E1DB; background: #FFFFFF;">
        <span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; flex-shrink: 0; border-radius: 999px; border: 2px solid #7D9189; display: flex; align-items: center; justify-content: center;"></span>
        <input type="radio" name="ordem" style="position: absolute; width: 1px; height: 1px; opacity: 0;">
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; line-height: 24px; font-weight: 600;">Ordem manual</span>
          <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">Você arrasta cada item pra onde quiser.</span>
        </span>
      </label>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #52655E;">Ordem das categorias</span>
      <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #D6E1DB; overflow: hidden;">
        <div style="min-height: 52px; padding: 0 4px 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #D6E1DB;">
          <span style="flex-grow: 1; font-size: 16px; line-height: 24px; font-weight: 500;">Mercearia</span>
          <button type="button" aria-label="Mover Mercearia" style="width: 48px; height: 48px; border: 0; background: transparent; color: #52655E; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg></button>
        </div><div style="min-height: 52px; padding: 0 4px 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #D6E1DB;">
          <span style="flex-grow: 1; font-size: 16px; line-height: 24px; font-weight: 500;">Carnes e frios</span>
          <button type="button" aria-label="Mover Carnes e frios" style="width: 48px; height: 48px; border: 0; background: transparent; color: #52655E; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg></button>
        </div><div style="min-height: 52px; padding: 0 4px 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #D6E1DB;">
          <span style="flex-grow: 1; font-size: 16px; line-height: 24px; font-weight: 500;">Laticínios e limpeza</span>
          <button type="button" aria-label="Mover Laticínios e limpeza" style="width: 48px; height: 48px; border: 0; background: transparent; color: #52655E; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg></button>
        </div><div style="min-height: 52px; padding: 0 4px 0 16px; display: flex; align-items: center; gap: 12px;">
          <span style="flex-grow: 1; font-size: 16px; line-height: 24px; font-weight: 500;">Hortifrúti</span>
          <button type="button" aria-label="Mover Hortifrúti" style="width: 48px; height: 48px; border: 0; background: transparent; color: #52655E; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg></button>
        </div>
      </div>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">Arraste pela alça pra seguir o caminho que você faz no mercado.</span>
    </div>
    <a href="#" style="height: 52px; border-radius: 12px; background: #246B55; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">Pronto</a>
  </div>
</div>

</body>
</html>
