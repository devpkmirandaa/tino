<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lista Compras de hoje</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#16221F}
a{color:#246B55}a:hover{color:#1C5946}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #16221F; overflow: hidden;">

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 40px 16px 0; gap: 12px;">

    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="#" aria-label="Voltar" style="width: 48px; height: 48px; margin-left: -12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #16221F;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-size: 24px; line-height: 32px; font-weight: 700;">Compras de hoje</h1>
      <button type="button" aria-label="Mais opções da lista" style="width: 48px; height: 48px; margin-right: -12px; flex-shrink: 0; border: 0; background: transparent; color: #52655E; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </button>
    </div>

    <div style="border-radius: 20px; background: #FFFFFF; border: 1px solid #D6E1DB; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <span style="font-size: 18px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums;">2 de 6 no carrinho</span>
        <span style="height: 28px; padding: 0 10px 0 8px; border-radius: 999px; background: #EAF1EE; color: #246B55; font-size: 12px; line-height: 16px; font-weight: 600; display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          Na compra
        </span>
      </div>
      <div role="progressbar" aria-label="Itens no carrinho" aria-valuenow="2" aria-valuemin="0" aria-valuemax="6" style="height: 6px; border-radius: 999px; background: #EAF1EE; overflow: hidden;">
        <div style="width: 33%; height: 6px; border-radius: 999px; background: #246B55;"></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #52655E;">Faltam 4</span>
      <a href="#" aria-label="Ordem: por categoria. Mudar" style="height: 40px; padding: 0 10px 0 14px; box-sizing: border-box; border-radius: 999px; border: 1px solid #7D9189; color: #246B55; text-decoration: none; font-size: 14px; line-height: 20px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
        Por categoria
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
    </div>

    <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px;">

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #52655E;">Mercearia</span>
        <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #D6E1DB; overflow: hidden;">
          <div style="min-height: 56px; padding-left: 4px; display: flex; align-items: center; border-bottom: 1px solid #D6E1DB;">
            <label style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"><input type="checkbox" aria-label="Arroz no carrinho" style="width: 22px; height: 22px; margin: 0; accent-color: #246B55;"></label>
            <button type="button" aria-label="Editar Arroz" style="flex-grow: 1; min-width: 0; min-height: 56px; padding: 0 16px 0 4px; border: 0; background: transparent; color: #16221F; text-align: left; display: flex; align-items: center; gap: 12px; font-family: inherit;">
              <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; line-height: 24px; font-weight: 500;">Arroz</span><span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">2 pacotes · 5 kg</span></span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52655E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg>
            </button>
          </div>
          <div style="min-height: 56px; padding-left: 4px; display: flex; align-items: center;">
            <label style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"><input type="checkbox" aria-label="Café no carrinho" style="width: 22px; height: 22px; margin: 0; accent-color: #246B55;"></label>
            <button type="button" aria-label="Editar Café" style="flex-grow: 1; min-width: 0; min-height: 56px; padding: 0 16px 0 4px; border: 0; background: transparent; color: #16221F; text-align: left; display: flex; align-items: center; gap: 12px; font-family: inherit;">
              <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; line-height: 24px; font-weight: 500;">Café</span><span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">1 pacote · 500 g</span></span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52655E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg>
            </button>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #52655E;">Laticínios</span>
        <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #D6E1DB; overflow: hidden;">
          <div style="min-height: 56px; padding-left: 4px; display: flex; align-items: center;">
            <label style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"><input type="checkbox" aria-label="Leite integral no carrinho" style="width: 22px; height: 22px; margin: 0; accent-color: #246B55;"></label>
            <button type="button" aria-label="Editar Leite integral" style="flex-grow: 1; min-width: 0; min-height: 56px; padding: 0 16px 0 4px; border: 0; background: transparent; color: #16221F; text-align: left; display: flex; align-items: center; gap: 12px; font-family: inherit;">
              <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; line-height: 24px; font-weight: 500;">Leite integral</span><span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">6 caixas</span></span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52655E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg>
            </button>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #52655E;">Limpeza</span>
        <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #D6E1DB; overflow: hidden;">
          <div style="min-height: 56px; padding-left: 4px; display: flex; align-items: center;">
            <label style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"><input type="checkbox" aria-label="Detergente no carrinho" style="width: 22px; height: 22px; margin: 0; accent-color: #246B55;"></label>
            <button type="button" aria-label="Editar Detergente" style="flex-grow: 1; min-width: 0; min-height: 56px; padding: 0 16px 0 4px; border: 0; background: transparent; color: #16221F; text-align: left; display: flex; align-items: center; gap: 12px; font-family: inherit;">
              <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; line-height: 24px; font-weight: 500;">Detergente</span><span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">3 unidades</span></span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52655E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg>
            </button>
          </div>
        </div>
      </div>

      <button type="button" aria-expanded="false" style="min-height: 48px; flex-shrink: 0; padding: 0 12px 0 16px; border: 0; border-radius: 12px; background: #EAF1EE; color: #16221F; text-align: left; display: flex; align-items: center; gap: 10px; font-family: inherit;">
        <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 600;">No carrinho · 2</span>
        <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">Ver</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>
  </div>

  <div style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #D6E1DB; border-radius: 24px 24px 0 0; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px;">

    <div style="display: flex; align-items: center; gap: 4px; height: 56px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #7D9189; background: #FFFFFF;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#246B55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
      <label for="novo" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Adicionar item</label>
      <input id="novo" placeholder="Adicionar item" style="flex-grow: 1; min-width: 0; height: 48px; padding: 0 6px; border: 0; outline: none; background: transparent; color: #16221F; font: 400 16px/24px 'Plus Jakarta Sans', system-ui, sans-serif;">
    </div>

    <div role="group" aria-label="Você costuma levar" style="display: flex; gap: 8px; overflow: hidden;">
      <button type="button" style="height: 40px; padding: 0 14px 0 10px; flex-shrink: 0; border: 0; border-radius: 999px; background: #EAF1EE; color: #16221F; font: 600 14px/20px 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; align-items: center; gap: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#246B55" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Ovos</button>
      <button type="button" style="height: 40px; padding: 0 14px 0 10px; flex-shrink: 0; border: 0; border-radius: 999px; background: #EAF1EE; color: #16221F; font: 600 14px/20px 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; align-items: center; gap: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#246B55" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Pão francês</button>
      <button type="button" style="height: 40px; padding: 0 14px 0 10px; flex-shrink: 0; border: 0; border-radius: 999px; background: #EAF1EE; color: #16221F; font: 600 14px/20px 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; align-items: center; gap: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#246B55" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Banana</button>
      <button type="button" style="height: 40px; padding: 0 14px 0 10px; flex-shrink: 0; border: 0; border-radius: 999px; background: #EAF1EE; color: #16221F; font: 600 14px/20px 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; align-items: center; gap: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#246B55" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Açúcar</button>
    </div>

    <a href="#" style="height: 56px; border-radius: 16px; background: #246B55; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg>
      Escanear preço
    </a>
  </div>
</div>

</body>
</html>
