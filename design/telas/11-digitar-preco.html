<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Digitar preço</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#16221F}
a{color:#246B55}a:hover{color:#1C5946}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8A9692; display: flex; flex-direction: column; justify-content: flex-end; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #16221F;">
  <div role="dialog" aria-label="Digitar preço" style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 16px;">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 999px; background: #D6E1DB; align-self: center;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700;">Digitar preço</h2>
      <a href="#" aria-label="Fechar" style="width: 48px; height: 48px; margin-right: -12px; display: flex; align-items: center; justify-content: center; color: #52655E;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: #EAF1EE; gap: 4px;">
      <button type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 8px; background: #FFFFFF; color: #16221F; font: 600 14px/20px 'Plus Jakarta Sans', system-ui, sans-serif;">Por unidade</button>
      <button type="button" aria-pressed="false" style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #52655E; font: 600 14px/20px 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>Por quilo</button>
    </div>
    <div style="display: flex; gap: 12px; align-items: flex-end;">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
        <label for="preco" style="font-size: 14px; line-height: 20px; font-weight: 600;">Preço</label>
        <input id="preco" value="R$ 7,49" inputmode="decimal" autofocus="" style="width: 100%; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 2px solid #246B55; background: #FFFFFF; color: #16221F; font: 700 24px/32px 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; line-height: 20px; font-weight: 600;">Quantidade</span>
        <div style="display: flex; align-items: center; border: 1px solid #7D9189; border-radius: 12px; height: 56px; box-sizing: border-box;">
          <button type="button" aria-label="Diminuir quantidade" style="width: 44px; height: 54px; border: 0; background: transparent; color: #16221F; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <span style="width: 24px; text-align: center; font-size: 16px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums;">2</span>
          <button type="button" aria-label="Aumentar quantidade" style="width: 44px; height: 54px; border: 0; background: transparent; color: #16221F; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="nome" style="font-size: 14px; line-height: 20px; font-weight: 600;">Nome <span style="font-weight: 500; color: #52655E;">(opcional)</span></label>
      <input id="nome" placeholder="Ex.: Arroz" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid #7D9189; background: #FFFFFF; color: #16221F; font: 400 16px/24px 'Plus Jakarta Sans', system-ui, sans-serif;">
    </div>
    <a href="#" style="height: 52px; border-radius: 12px; background: #246B55; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">Adicionar · R$ 14,98</a>
  </div>
  <div aria-hidden="true" style="height: 300px; background: #EAF1EE; border-top: 1px solid #D6E1DB; display: flex; align-items: center; justify-content: center;">
    <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">Teclado numérico do celular</span>
  </div>
</div>

</body>
</html>
