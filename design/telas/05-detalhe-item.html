    <div style="display: flex; align-items: center; justify-content: space-between;">

      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #52655E;">Na etiqueta: MOLHO DE TOMATE PIZZA QUERO 240G</span>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: #EAF1EE; gap: 4px;">
      <button type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 8px; background: #FFFFFF; color: #16221F; font: 600 14px/20px 'Plus Jakarta Sans', system-ui, sans-serif;">Por unidade</button>

    </div>

    <div style="display: flex; gap: 12px; align-items: flex-end;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
        <label for="preco" style="font-size: 14px; line-height: 20px; font-weight: 600;">Preço</label>
        <input id="preco" value="R$ 3,00" inputmode="decimal" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid #7D9189; background: #FFFFFF; color: #16221F; font: 700 18px/26px 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; line-height: 20px; font-weight: 600;">Quantidade</span>

          <button type="button" aria-label="Diminuir quantidade" style="width: 48px; height: 50px; border: 0; background: transparent; color: #16221F; display: flex; align-items: center; justify-content: center;">

          <span style="width: 28px; text-align: center; font-size: 16px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums;">1</span>

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
          </button>

      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 16px; background: #EAF1EE;">
      <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #52655E;">Subtotal</span>
      <span style="font-size: 20px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums;">R$ 3,00</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <a href="04-comprar-carrinho.html" style="height: 52px; border-radius: 12px; background: #246B55; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Salvar</a>
      <button type="button" style="height: 48px; border: 0; background: transparent; color: #52655E; font: 600 14px/20px 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
