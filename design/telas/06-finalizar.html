<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; display: flex; flex-direction: column; padding: 40px 16px 28px; gap: 20px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #16221F;">
